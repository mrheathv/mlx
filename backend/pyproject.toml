[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlxstudio-backend"
version = "0.1.0"
description = "Local MLX inference backend for MLX Studio (spoken to over stdio JSON-lines by the SwiftUI app)"
requires-python = ">=3.11"
dependencies = [
    # mflux is pinned exactly: engines/mflux_engine.py is written against
    # 0.18.0's source, and the checkpoints in models.py were verified
    # against its parameter layout. Bumping it means re-checking both.
    "mflux==0.18.0",
    "mlx>=0.29",
    "huggingface_hub>=0.25",
    "psutil>=6.0",
    # Pillow 13.0.0 does `from numbers import _IntegralLike`, which fails
    # on Python 3.11-3.13 and breaks `import mflux` outright.
    "pillow>=10,<13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["mlxstudio_backend*"]
