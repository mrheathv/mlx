[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlxstudio-backend"
version = "0.1.0"
description = "Local MLX inference backend for MLX Studio (spoken to over stdio JSON-lines by the SwiftUI app)"
requires-python = ">=3.11"
dependencies = [
    # mflux is pinned exactly: engines/mflux_engine.py is written against
    # 0.24.0's source, and the checkpoints in models.py were verified
    # against its parameter layout. Bumping it means re-checking both.
    "mflux==0.24.0",
    # 0.30 is the first MLX with kernels for the M5 GPU's Neural
    # Accelerators (used on macOS 26.2+). mflux 0.24 itself needs >=0.32.
    "mlx>=0.30",
    "huggingface_hub>=0.25",
    "psutil>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["mlxstudio_backend*"]
